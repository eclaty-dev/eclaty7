<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" id="meta-desc" content="ECLATY7 – Plateforme de recommandation beauté et bien-être. Solutions naturelles sélectionnées pour la peau, les cheveux, la minceur et la vitalité.">
<meta name="google-site-verification" content="n27l5YJS7lJ9_78CZKOAm3-GKW2jPyococR8QNRwUkI">
<meta name="p:domain_verify" content="c01d275bddc3a7742f489dc753819efd">
<title id="pg-title">ECLATY7 – Sublimez efficacement l'éclat nature de votre beauté</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAFAF7;--ink:#1A1A1A;--sage:#7A9B7E;--sage-d:#5C7D60;--sage-l:#EAF1EA;
  --gold:#C8A24D;--gold-d:#A8842F;--gold-l:#FBF3E0;--r:12px;--maxw:1180px;
}
html{scroll-behavior:smooth}
body{font-family:'Cormorant Garamond',serif;background:var(--cream);color:var(--ink);overflow-x:hidden;line-height:1.7;font-weight:500}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none}
h1,h2,h3,h4{font-weight:800;line-height:1.2}

/* ===== NAV — simple, opaque, no blur, no hamburger ===== */
header#nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:#FFFFFF;border-bottom:1px solid #ECECE8;height:72px}
.nav-wrap{max-width:var(--maxw);margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-logo img{width:40px;height:40px;object-fit:contain}
.nav-logo-txt{font-size:24px;font-weight:800;color:#1F6F6B;letter-spacing:1px}
.nav-logo-txt span{color:var(--gold)}
.nav-menu{display:flex;align-items:center;gap:28px;list-style:none}
.nav-menu a{font-size:17px;font-weight:600;color:var(--ink);padding:6px 2px;border-bottom:2px solid transparent}
.nav-menu a.act,.nav-menu a:hover{color:var(--sage-d);border-bottom-color:var(--sage)}
.nav-lang{display:flex;gap:6px;margin-left:8px}
.nav-lang button{background:#F4F4F1;border:1px solid #E2E2DC;border-radius:6px;padding:5px 10px;font-size:13.5px;font-weight:700;color:var(--ink)}
.nav-lang button.on{background:var(--sage);color:#fff;border-color:var(--sage)}
@media(max-width:880px){
  .nav-menu{gap:14px}
  .nav-menu a{font-size:15px}
  .nav-logo-txt{font-size:20.5px}
  .nav-lang button{padding:4px 7px;font-size:12.5px}
}
@media(max-width:680px){
  .nav-wrap{padding:0 12px;flex-wrap:wrap;height:auto;min-height:72px}
  .nav-menu{gap:10px;width:100%;justify-content:center;padding:8px 0;border-top:1px solid #ECECE8;flex-wrap:wrap}
  .nav-menu a{font-size:14px}
}

main{padding-top:72px}
@media(max-width:680px){main{padding-top:108px}}

/* ===== SECTIONS ===== */
section{padding:72px 24px}
.wrap{max-width:var(--maxw);margin:0 auto}
.tc{text-align:center}
.eyebrow{display:inline-block;background:var(--sage-l);color:var(--sage-d);font-size:13.5px;font-weight:700;padding:5px 14px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px}
h1{font-size:clamp(36px,5vw,58px)}
h2.sec-title{font-size:clamp(27px,3.2vw,36px);margin-bottom:14px}
.sec-sub{font-size:19.5px;color:#555;max-width:680px;font-weight:400}
.bg-alt{background:#F2F2EE}

/* HERO */
.hero{position:relative;min-height:92vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-ov{position:absolute;inset:0;background:rgba(20,20,18,0.55)}
.hero-cnt{position:relative;z-index:2;max-width:820px;padding:40px 24px}
.hero h1{color:#fff;font-style:italic;margin-bottom:18px;text-shadow:0 2px 20px rgba(0,0,0,.4)}
.hero h2{color:rgba(255,255,255,.92);font-size:clamp(18px,2vw,21.5px);font-weight:400;margin-bottom:36px;max-width:640px;margin-left:auto;margin-right:auto}
.hero-logo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:28px}
.hero-logo img{width:64px;height:64px;object-fit:contain}
.hero-logo-name{font-size:39px;font-weight:800;color:#fff;letter-spacing:2px}
.hero-logo-name span{color:#E8C04E}
.btn-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.btn{display:inline-block;padding:14px 30px;border-radius:10px;font-weight:700;font-size:17px;transition:transform .2s,box-shadow .2s}
.btn-gold{background:var(--gold);color:#fff;box-shadow:0 6px 20px rgba(168,132,47,.35)}
.btn-gold:hover{background:var(--gold-d);transform:translateY(-2px)}
.btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7)}
.btn-outline:hover{background:rgba(255,255,255,.15)}
.btn-sage{background:var(--sage);color:#fff}
.btn-sage:hover{background:var(--sage-d);transform:translateY(-2px)}

/* PAGE HERO (inner pages) */
.phero{position:relative;min-height:42vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.phero-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.phero-ov{position:absolute;inset:0;background:rgba(20,20,18,.5)}
.phero-cnt{position:relative;z-index:2;padding:50px 24px;max-width:760px}
.phero h1{color:#fff;font-size:clamp(31.5px,4vw,47px);margin-bottom:10px;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.phero h2{color:rgba(255,255,255,.88);font-size:clamp(15.5px,1.8vw,19px);font-weight:400}

.bread{padding:14px 24px;font-size:15px;color:#888;max-width:var(--maxw);margin:0 auto}
.bread a{color:var(--sage-d);font-weight:600}

/* 2-COL */
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
.two.rev .two-img{order:-1}
.two-img{border-radius:var(--r);overflow:hidden;aspect-ratio:4/3.1;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.two-img img{width:100%;height:100%;object-fit:cover}
.two p{font-size:18px;color:#444;margin-bottom:20px;line-height:1.85;font-weight:500}

/* EXPERTISE 4 BLOCKS */
.exp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.exp-card{background:#fff;border-radius:var(--r);padding:28px 20px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.06);transition:transform .25s,box-shadow .25s}
.exp-card:hover{transform:translateY(-6px);box-shadow:0 14px 32px rgba(0,0,0,.1)}
.exp-ico{width:56px;height:56px;border-radius:50%;margin:0 auto 16px;overflow:hidden;background:var(--sage-l)}
.exp-ico img{width:100%;height:100%;object-fit:cover}
.exp-card h3{font-size:20.5px;margin-bottom:6px}
.exp-card p{font-size:15px;color:#777}
@media(max-width:880px){.exp-grid{grid-template-columns:repeat(2,1fr)}}

/* TRUST 6 POINTS */
.trust-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.trust-item{display:flex;gap:14px;align-items:flex-start;background:#fff;padding:20px;border-radius:var(--r);box-shadow:0 2px 12px rgba(0,0,0,.05)}
.trust-ico{width:42px;height:42px;border-radius:10px;background:var(--gold-l);display:flex;align-items:center;justify-content:center;font-size:20.5px;flex-shrink:0;color:var(--gold-d)}
.trust-item h4{font-size:18px;margin-bottom:4px}
.trust-item p{font-size:15px;color:#777}
@media(max-width:680px){.trust-grid{grid-template-columns:1fr}}

/* BLOG CARDS */
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.blog-card{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.06);transition:transform .25s}
.blog-card:hover{transform:translateY(-5px)}
.blog-img{height:170px;background:linear-gradient(135deg,var(--sage-l),var(--gold-l));display:flex;align-items:center;justify-content:center;font-size:15px;color:#999;text-transform:uppercase;letter-spacing:1px}
.blog-body{padding:20px}
.blog-cat{display:inline-block;background:var(--sage-l);color:var(--sage-d);font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:14px;margin-bottom:10px}
.blog-body h3{font-size:19.5px;margin-bottom:8px}
.blog-body p{font-size:15px;color:#777;margin-bottom:12px}
.blog-link{color:var(--gold-d);font-weight:700;font-size:15px}
@media(max-width:880px){.blog-grid{grid-template-columns:1fr}}

/* CTA BANNER */
.cta-ban{background:linear-gradient(120deg,#1C2E22,#27402F);border-radius:18px;padding:56px 36px;text-align:center}
.cta-ban h2{color:#fff;font-size:clamp(24.5px,3vw,33.5px);margin-bottom:12px;font-style:italic}
.cta-ban p{color:rgba(255,255,255,.75);margin-bottom:26px;font-size:18px;max-width:560px;margin-left:auto;margin-right:auto}

/* MISSION 2x2 */
.mission-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.mission-card{background:#fff;border-radius:var(--r);padding:24px;display:flex;gap:16px;align-items:flex-start;box-shadow:0 2px 14px rgba(0,0,0,.05)}
.mission-ico{width:52px;height:52px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--sage-l)}
.mission-ico img{width:100%;height:100%;object-fit:cover}
.mission-card h4{font-size:18px;margin-bottom:4px}
.mission-card p{font-size:15px;color:#777}
@media(max-width:680px){.mission-grid{grid-template-columns:1fr}}

/* AFFIL BOX */
.affil-box{background:#E7F1F5;border-radius:var(--r);padding:30px;display:flex;gap:18px;align-items:flex-start;border-left:4px solid #3F8A9C}
.affil-box h3{font-size:21.5px;margin-bottom:8px}
.affil-box p{font-size:16px;color:#444;line-height:1.8}

/* CRIT LIST */
.crit-list{list-style:none}
.crit-list li{padding:8px 0;display:flex;gap:10px;font-size:17px;border-bottom:1px solid #ECECE8}
.crit-list li::before{content:'✓';color:var(--sage-d);font-weight:800}

/* PILIER (Products) */
.pilier-hero{position:relative;padding:50px 24px;color:#fff;overflow:hidden}
.pilier-hero .wrap{position:relative;z-index:2}
.p1{background:linear-gradient(120deg,#3A2050,#5C3580)}
.p2{background:linear-gradient(120deg,#163D24,#2A6B3D)}
.p3{background:linear-gradient(120deg,#5A3A10,#9C6A1F)}
.p4{background:linear-gradient(120deg,#16283D,#2C5275)}
.pilier-tag{display:inline-block;background:rgba(255,255,255,.18);font-size:13.5px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:14px}
.pilier-hero h2{font-size:clamp(27px,3.5vw,40.5px);font-style:italic;margin-bottom:10px}
.pilier-hero p{font-size:17px;opacity:.85;max-width:600px}

.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:36px 24px;max-width:var(--maxw);margin:0 auto}
.prod-card{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.06);display:flex;flex-direction:column}
.prod-media{height:230px;background:#F4F1FA;overflow:hidden}
.prod-media img{width:100%;height:100%;object-fit:cover}
.prod-body{padding:18px;display:flex;flex-direction:column;flex:1}
.prod-body h3{font-size:20.5px;margin-bottom:2px}
.prod-sub{font-size:12.5px;color:var(--sage-d);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.prod-h2{font-size:14px;color:#666;margin-bottom:10px;font-style:italic;line-height:1.5}
.prod-desc{font-size:15px;color:#777;margin-bottom:12px;line-height:1.6;flex:1}
.prod-benefits{font-size:13.5px;color:#555;margin-bottom:10px;line-height:1.7}
.prod-benefits b{color:var(--sage-d)}
.prod-rass{background:var(--sage-l);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--sage-d);text-align:center;margin-bottom:10px;font-weight:600}
.prod-cta{display:block;text-align:center;background:var(--gold);color:#fff;padding:12px;border-radius:8px;font-weight:700;font-size:15px;margin-bottom:6px;transition:background .2s}
.prod-cta:hover{background:var(--gold-d)}
.prod-cta2{display:block;text-align:center;background:var(--sage);color:#fff;padding:11px;border-radius:8px;font-weight:600;font-size:14px;margin-bottom:6px}
.prod-cta2:hover{background:var(--sage-d)}
.prod-alt{font-size:11.5px;color:#bbb;font-style:italic;text-align:center;margin-top:4px}
@media(max-width:880px){.prod-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.prod-grid{grid-template-columns:1fr}}

.placeholder-box{background:#fff;border-radius:var(--r);padding:50px 30px;text-align:center;max-width:640px;margin:30px auto;box-shadow:0 2px 14px rgba(0,0,0,.05)}
.placeholder-box h3{font-size:24px;margin-bottom:10px}
.placeholder-box p{color:#777;font-size:16px}

/* CONTACT */
.contact-wrap{max-width:600px;margin:0 auto}
.f-row{margin-bottom:16px}
.f-row label{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
.f-row input,.f-row textarea{width:100%;padding:13px 16px;border:1.5px solid #E2E2DC;border-radius:9px;font-size:17px;font-family:inherit;background:#fff;color:var(--ink)}
.f-row input:focus,.f-row textarea:focus{outline:none;border-color:var(--sage)}
.f-row textarea{min-height:130px;resize:vertical}
.f-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.f-2{grid-template-columns:1fr}}
.btn-submit{width:100%;background:var(--gold);color:#fff;padding:15px;border-radius:10px;font-weight:700;font-size:18px}
.btn-submit:hover{background:var(--gold-d)}
.f-success{display:none;background:var(--sage-l);border:1.5px solid var(--sage);color:var(--sage-d);border-radius:10px;padding:16px;text-align:center;font-weight:600;margin-top:14px}
.contact-icons{display:flex;gap:16px;justify-content:center;margin-top:28px}
.c-icon{width:52px;height:52px;border-radius:50%;background:#fff;border:1.5px solid #E2E2DC;display:flex;align-items:center;justify-content:center;transition:transform .2s,border-color .2s,box-shadow .2s}
.c-icon:hover{transform:scale(1.1);box-shadow:0 6px 18px rgba(0,0,0,.1)}
.c-icon-mail{color:var(--gold-d)}
.c-icon-mail:hover{border-color:var(--gold-d)}
.c-icon-wa{color:#25D366}
.c-icon-wa:hover{border-color:#25D366}
.c-icon-pin{color:#E60023}
.c-icon-pin:hover{border-color:#E60023}
.privacy-note{text-align:center;margin-top:18px;font-size:15px;color:var(--sage-d)}

/* FOOTER */
footer{background:#15201A;color:rgba(255,255,255,.55);padding:46px 24px 26px}
.ft-wrap{max-width:var(--maxw);margin:0 auto}
.ft-logo{font-size:25px;font-weight:800;color:#5FB8B0;margin-bottom:4px}
.ft-logo span{color:#E8C04E}
.ft-tag{font-size:13.5px;color:rgba(255,255,255,.32);margin-bottom:22px;font-style:italic}
.ft-nav{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:20px}
.ft-nav a{font-size:15px;color:rgba(255,255,255,.6);font-weight:500}
.ft-nav a:hover{color:var(--gold)}
.ft-affil{font-size:13px;line-height:1.7;max-width:640px;color:rgba(255,255,255,.32);margin-bottom:8px}
.ft-legal{font-size:12.5px;color:rgba(255,255,255,.22)}
.ft-bottom{border-top:1px solid rgba(255,255,255,.07);margin-top:20px;padding-top:16px;font-size:12.5px;color:rgba(255,255,255,.18);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}

@media(max-width:880px){.two{grid-template-columns:1fr;gap:30px}.two.rev .two-img{order:0}}
@media(max-width:600px){section{padding:50px 16px}.cta-ban{padding:36px 20px}}
</style>
</head>
<body>

<header id="nav">
  <div class="nav-wrap">
    <a class="nav-logo" href="#/fr/accueil" data-pg="accueil">
      <img src="img/logo_eclaty7.png" alt="ECLATY7">
      <span class="nav-logo-txt">ECLAT<span>Y</span>7</span>
    </a>
    <ul class="nav-menu" id="nav-menu"></ul>
  </div>
</header>

<main>
  <div id="pg-accueil" class="pg"></div>
  <div id="pg-apropos" class="pg"></div>
  <div id="pg-produits" class="pg"></div>
  <div id="pg-blog" class="pg"></div>
  <div id="pg-contact" class="pg"></div>
</main>

<footer>
  <div class="ft-wrap">
    <div class="ft-logo">ECLAT<span>Y</span>7</div>
    <p class="ft-tag" id="ft-slogan"></p>
    <nav class="ft-nav" id="ft-nav"></nav>
    <p class="ft-affil" id="ft-affil"></p>
    <p class="ft-legal" id="ft-legal"></p>
    <div class="ft-bottom"><span id="ft-copy"></span><span id="ft-desc"></span></div>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
