<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECLATY7 — Tous nos liens</title>
<meta name="description" content="Retrouvez tous les liens ECLATY7 : articles, avis produits, catégories beauté, minceur et vitalité.">
<meta name="robots" content="index,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAFAF7;--ink:#1A1A1A;--sage:#7A9B7E;--sage-d:#5C7D60;--sage-l:#EAF1EA;
  --gold:#C8A24D;--gold-d:#A8842F;--gold-l:#FBF3E0;--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cormorant Garamond',serif;background:var(--cream);color:var(--ink);line-height:1.5;font-weight:500;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px 32px}
.wrap{width:100%;max-width:440px;text-align:center}
.logo{font-size:30px;font-weight:700;letter-spacing:1px;margin-bottom:6px}
.logo span{color:var(--gold-d)}
.tagline{font-size:17px;color:#666;margin-bottom:34px;font-style:italic}
.links{display:flex;flex-direction:column;gap:14px}
a.btn{display:block;background:#fff;border:1.5px solid #E2E2DC;border-radius:var(--r);padding:18px 20px;text-decoration:none;color:var(--ink);font-size:19px;font-weight:600;transition:transform .15s,border-color .15s,box-shadow .15s}
a.btn:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 22px rgba(0,0,0,.07)}
a.btn .emoji{margin-right:10px}
a.btn.gold{background:var(--gold-l);border-color:var(--gold)}
a.btn.sage{background:var(--sage-l);border-color:var(--sage)}
.footer{margin-top:40px;font-size:14px;color:#999}
.footer a{color:var(--gold-d);text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">ECLAT<span>Y</span>7</div>
    <div class="tagline">Solutions naturelles pour sublimer votre vie</div>

    <div class="links">
      <a class="btn gold" href="https://eclaty7.pages.dev/#/fr/blog">📝 Nos derniers articles &amp; avis</a>
      <a class="btn" href="https://eclaty7.pages.dev/#/fr/produits">✨ Compléments Beauté</a>
      <a class="btn" href="https://eclaty7.pages.dev/#/fr/produits">🔥 Compléments Minceur</a>
      <a class="btn" href="https://eclaty7.pages.dev/#/fr/produits">⚡ Compléments Vitalité</a>
      <a class="btn sage" href="https://eclaty7.pages.dev/#/fr/accueil">🏠 Découvrir le site ECLATY7</a>
      <a class="btn" href="https://eclaty7.pages.dev/#/fr/contact">✉️ Nous contacter</a>
    </div>

    <div class="footer">
      <a href="https://www.pinterest.com/eclaty7/">Pinterest</a> · eclaty7.pages.dev
    </div>
  </div>
</body>
</html>
